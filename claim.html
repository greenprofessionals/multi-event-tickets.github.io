<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Claim Your Ticket</title><meta name="description" content="Claim a digital event ticket."><meta property="og:image" content="images/claim-og.jpg"><link rel="stylesheet" href="styles.css"><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script><script src="site-config.js"></script><script src="shared.js"></script></head><body><header><div class="eyebrow" id="eyebrow">Digital Event Ticketing System</div><h1 id="title">Claim Your Ticket</h1><p id="tagline">Choose your ticket details below.</p></header><main>
<div class="card" id="formCard"><div id="eventPickerWrap" class="hidden"><label>Event</label><select id="eventPicker"></select></div><form id="form"><label>Full name</label><input id="name" required autocomplete="name"><div class="row"><div><label>Email <span style="font-weight:400">(optional)</span></label><input id="email" type="email" autocomplete="email"></div><div><label>Phone <span style="font-weight:400">(optional)</span></label><input id="phone" type="tel" autocomplete="tel"></div></div><div id="groupWrap"><label id="groupLabel">Chapter</label><select id="group"></select></div><label>Ticket type</label><div id="tiers"></div><button style="margin-top:18px" type="submit">Claim My Ticket</button><div id="err"></div></form></div>
<div class="card ticket-result hidden" id="result"><h2>Your ticket is ready</h2><div id="serial" style="font-size:20px;font-weight:800;color:var(--green);margin-bottom:12px"></div><canvas id="ticket"></canvas><div class="toolbar" style="justify-content:center;margin-top:14px"><a class="btn gold" id="download" download="ticket.png">Download Ticket</a><button class="secondary" id="share" type="button">Share Ticket</button></div></div>
</main><footer>Digital ticket · Present QR at check-in</footer><script>
let eventId=MultiTickets.qs('event'),eventData=null,tiers={};
const nameEl=document.getElementById('name'),emailEl=document.getElementById('email'),phoneEl=document.getElementById('phone'),groupEl=document.getElementById('group'),ticketEl=document.getElementById('ticket'),serialEl=document.getElementById('serial'),downloadEl=document.getElementById('download'),formCardEl=document.getElementById('formCard'),resultEl=document.getElementById('result');
const err=document.getElementById('err');function error(m){err.className='error';err.textContent=m}async function populateEvent(id){const d=await MultiTickets.loadEvent(id);eventData=d.event;tiers=d.tiers||{};document.getElementById('eyebrow').textContent=`${eventData.OrgName} · ${eventData.ChapterName}`;document.getElementById('title').textContent=eventData.EventTitle;document.getElementById('tagline').textContent=eventData.Tagline||'Claim your ticket below.';const tierBox=document.getElementById('tiers');tierBox.innerHTML=Object.entries(tiers).map(([k,t],i)=>`<label style="border:1px solid #d6cfbd;border-radius:10px;padding:12px;margin:8px 0;display:flex;gap:10px;align-items:center"><input style="width:auto" type="radio" name="tier" value="${MultiTickets.esc(k)}" ${i===0?'checked':''}><span>${MultiTickets.esc(t.label)}</span><strong style="margin-left:auto">${MultiTickets.money(t.price,eventData.CurrencySymbol||'$')}</strong></label>`).join('');const use=String(eventData.UseGroups).toLowerCase()!=='false';document.getElementById('groupWrap').classList.toggle('hidden',!use);document.getElementById('groupLabel').textContent=eventData.GroupLabel||'Chapter';const cleanGroups=(d.groups||[]).map(g=>String(g??'').trim()).filter(g=>g && g.toLowerCase()!=='undefined' && g.toLowerCase()!=='null');groupEl.innerHTML=cleanGroups.map(g=>`<option value="${MultiTickets.esc(g)}">${MultiTickets.esc(g)}</option>`).join('')}
(async()=>{try{if(!eventId){const events=await MultiTickets.loadEvents(),sel=document.getElementById('eventPicker');document.getElementById('eventPickerWrap').classList.remove('hidden');sel.innerHTML=events.filter(e=>e.Status==='Active').map(e=>`<option value="${e.EventID}">${MultiTickets.esc(e.EventTitle)} — ${MultiTickets.esc(e.ChapterName)}</option>`).join('');eventId=sel.value;sel.onchange=()=>{eventId=sel.value;populateEvent(eventId).catch(e=>error(e.message))}}if(eventId)await populateEvent(eventId)}catch(e){error(e.message)}})();
document.getElementById('form').addEventListener('submit',async ev=>{ev.preventDefault();err.textContent='';const tier=document.querySelector('input[name=tier]:checked')?.value||'';try{const d=await MultiTickets.post({action:'claim',eventId,fullName:nameEl.value.trim(),email:emailEl.value.trim(),phone:phoneEl.value.trim(),groupName:groupEl.value||'',tier});if(!d.ok)throw new Error(d.error||'Could not claim ticket.');await MultiTickets.renderTicket(ticketEl,eventData,tiers,d.tier,d.serial,d.checkInToken);serialEl.textContent=d.serial;downloadEl.href=ticketEl.toDataURL('image/png');downloadEl.download=`ticket-${d.serial}.png`;formCardEl.classList.add('hidden');resultEl.classList.remove('hidden')}catch(e){error(e.message)}});
document.getElementById('share').onclick=async()=>{try{const blob=await new Promise(r=>ticketEl.toBlob(r,'image/png'));const f=new File([blob],downloadEl.download,{type:'image/png'});if(navigator.canShare?.({files:[f]}))await navigator.share({files:[f],title:'My Ticket'});else alert('Use Download Ticket, then share the saved image.')}catch(_){}};
</script></body></html>
