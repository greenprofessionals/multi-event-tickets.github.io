<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Multi-Event Ticketing</title><meta name="description" content="Choose an event to claim a ticket."><meta property="og:image" content="images/claim-og.jpg"><link rel="stylesheet" href="styles.css"><script src="site-config.js"></script><script src="shared.js"></script></head><body><header><div class="eyebrow">Digital Event Ticketing System</div><h1>Choose Your Event</h1><p>One ticketing platform, multiple independently branded events.</p></header><main><div class="card"><h2>Available events</h2><div id="events"><div class="notice">Loading events…</div></div></div><div class="toolbar"><a class="btn secondary" href="admin.html">Admin Control Center</a><a class="btn secondary" href="gate.html">Gate Check-In</a><a class="btn secondary" href="config.html">Event Configuration</a></div></main><footer>Multi-Event Ticketing System</footer><script>
(async()=>{const box=document.getElementById('events');try{const events=await MultiTickets.loadEvents();const active=events.filter(e=>e.Status==='Active');const list=active.length?active:events.filter(e=>e.Status!=='Archived');if(!list.length){box.innerHTML='<div class="notice">No events are published yet.</div>';return}box.innerHTML=list.map(e=>`<div class="event-card"><span class="pill">${MultiTickets.esc(e.Status)}</span><h3>${MultiTickets.esc(e.EventTitle)}</h3><div><strong>${MultiTickets.esc(e.ChapterName)}</strong></div><div>${MultiTickets.esc(e.EventDate||'')} · ${MultiTickets.esc(e.VenueName||'')}</div><p><a class="btn" href="claim.html?event=${encodeURIComponent(e.EventID)}">Claim Ticket</a></p></div>`).join('')}catch(err){box.innerHTML=`<div class="error">${MultiTickets.esc(err.message)}</div>`}})();
</script></body></html>
