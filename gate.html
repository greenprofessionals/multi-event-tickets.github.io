<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gate Check-In</title><meta property="og:image" content="images/gate-og.jpg"><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script><script src="site-config.js"></script><script src="shared.js"></script></head><body><header><div class="eyebrow">Multi-Event Ticketing</div><h1>Gate Check-In</h1><p>Fast QR scan, manual lookup and walk-ins.</p></header><main>
<div class="card" id="loginCard"><h2>Gate Access</h2><label>Admin passcode</label><input id="pass" type="password"><button id="unlock" style="margin-top:12px">Unlock Gate</button><div id="loginMsg"></div></div>
<div id="gateApp" class="hidden"><div class="card"><div class="row"><div><label>Event</label><select id="eventSel"></select></div><div style="align-self:end"><a class="btn secondary" href="admin.html">Control Center</a></div></div></div>
<div class="card"><h2>Guest With Ticket</h2><label>Ticket number or secure QR token</label><input id="checkInSerial" placeholder="e.g. NY-007"><div class="toolbar" style="margin-top:10px"><button id="scanQrBtn">📷 Scan QR Code</button><button class="secondary" id="photoBtn">🖼️ Scan from Photo</button><input id="qrImageInput" type="file" accept="image/*" capture="environment" class="hidden"></div><div class="row"><div><label>Payment status</label><select id="payStatus"><option>Paid</option><option>Pending</option><option>Complimentary</option><option>Sponsored</option><option>Waived</option></select></div><div><label>Payment method</label><select id="payMethod"><option></option><option>Cash</option><option>Zelle</option><option>Cash App</option><option>Credit Card</option><option>Check</option><option>Other</option></select></div><div><label>Amount paid</label><input id="amountPaid" type="number" min="0" step="0.01"></div></div><button id="checkInSerialBtn" style="margin-top:12px">Check In Guest</button><div id="checkInSerialResult"></div></div>
<div class="card"><h2>Guest Search</h2><div class="row"><div><label>Name, phone, email or serial</label><input id="searchQ"></div><div style="align-self:end"><button id="searchBtn">Search</button></div></div><div id="searchOut"></div></div>
<div class="card"><h2>Walk-In</h2><div class="row"><div><label>Full name</label><input id="wiName"></div><div><label>Phone</label><input id="wiPhone"></div></div><div id="wiGroupWrap"><label id="wiGroupLabel">Chapter</label><select id="wiGroup"></select></div><label>Ticket type</label><select id="wiTier"></select><div class="row"><div><label>Payment status</label><select id="wiStatus"><option>Paid</option><option>Pending</option><option>Complimentary</option><option>Sponsored</option><option>Waived</option></select></div><div><label>Payment method</label><select id="wiMethod"><option></option><option>Cash</option><option>Zelle</option><option>Cash App</option><option>Credit Card</option><option>Check</option><option>Other</option></select></div><div><label>Amount paid</label><input id="wiAmount" type="number" min="0" step="0.01"></div></div><button id="walkBtn" style="margin-top:12px">Sell & Check In</button><div id="walkMsg"></div></div></div>
<div id="scannerOverlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:1000;flex-direction:column;align-items:center;justify-content:center;padding:20px"><video id="scannerVideo" playsinline autoplay muted style="width:100%;max-width:440px;border-radius:14px;background:#000"></video><canvas id="scannerCanvas" style="display:none"></canvas><p id="scannerStatus" style="color:#fff;font-size:17px;text-align:center;max-width:520px">Point the camera at the ticket QR code.</p><button id="scannerCloseBtn" class="gold">Cancel</button></div>
</main><footer>Successful check-in is recorded immediately in the new event's CheckIns sheet.</footer><script>
let adminPass='',current='',eventData=null,tiers={};const msg=(id,t,k='notice')=>{const e=document.getElementById(id);e.className=k;e.textContent=t};async function api(action,extra={}){return MultiTickets.post({action,adminPasscode:adminPass,eventId:current,...extra})}async function configure(){current=eventSel.value;const d=await MultiTickets.loadEvent(current);eventData=d.event;tiers=d.tiers||{};wiTier.innerHTML=Object.entries(tiers).map(([k,t])=>`<option value="${k}">${MultiTickets.esc(t.label)} — ${MultiTickets.money(t.price,eventData.CurrencySymbol||'$')}</option>`).join('');const use=String(eventData.UseGroups).toLowerCase()!=='false';wiGroupWrap.classList.toggle('hidden',!use);wiGroupLabel.textContent=eventData.GroupLabel||'Chapter';wiGroup.innerHTML=(d.groups||[]).map(g=>`<option>${MultiTickets.esc(g)}</option>`).join('')}
unlock.onclick=async()=>{adminPass=pass.value.trim();const d=await api('verifyPasscode');if(!d.ok){msg('loginMsg',d.error,'error');return}const ev=await api('eventsAdmin');eventSel.innerHTML=(ev.events||[]).filter(e=>e.Status!=='Archived').map(e=>`<option value="${e.EventID}">${MultiTickets.esc(e.EventTitle)} — ${MultiTickets.esc(e.ChapterName)}</option>`).join('');const q=MultiTickets.qs('event');if(q&&[...eventSel.options].some(o=>o.value===q))eventSel.value=q;loginCard.classList.add('hidden');gateApp.classList.remove('hidden');await configure()};eventSel.onchange=configure;
async function doCheckIn(){const serial=checkInSerial.value.trim();if(!serial){msg('checkInSerialResult','Enter or scan a ticket.','error');return}const d=await api('checkInWithTicket',{serial,paymentStatus:payStatus.value,paymentMethod:payMethod.value,amountPaid:Number(amountPaid.value)||0});if(d.ok){checkInSerialResult.className='gate-result good';checkInSerialResult.innerHTML=`✓ VALID TICKET<br><span style="font-size:32px">${MultiTickets.esc(d.name)}</span><br><span style="font-size:18px">${MultiTickets.esc(tiers[d.tier]?.label||d.tier)} · ${MultiTickets.esc(d.groupName||'')} · ${MultiTickets.esc(d.serial)}</span>`;checkInSerial.value='';navigator.vibrate?.(120)}else{checkInSerialResult.className='gate-result bad';checkInSerialResult.innerHTML=d.alreadyCheckedIn?`✕ ALREADY CHECKED IN<br>${MultiTickets.esc(d.name||'')}<br><span style="font-size:16px">${MultiTickets.esc(d.serial||'')}</span>`:`✕ NOT VALID<br><span style="font-size:16px">${MultiTickets.esc(d.error||'Ticket could not be checked in.')}</span>`;navigator.vibrate?.([100,80,100])}}
checkInSerialBtn.onclick=doCheckIn;searchBtn.onclick=async()=>{const d=await api('searchGuests',{query:searchQ.value.trim()});searchOut.innerHTML=d.ok&&d.results.length?d.results.map(r=>`<div class="event-card"><strong>${MultiTickets.esc(r.name)}</strong> — ${r.serial}<br>${MultiTickets.esc(tiers[r.tier]?.label||r.tier)} · ${MultiTickets.esc(r.paymentStatus)} · ${r.checkedIn?'Already checked in':'Not checked in'}<div class="toolbar" style="margin-top:8px"><button class="secondary useSerial" data-s="${r.serial}">Use Ticket</button></div></div>`).join(''):'<div class="notice">No matches.</div>';document.querySelectorAll('.useSerial').forEach(b=>b.onclick=()=>{checkInSerial.value=b.dataset.s;window.scrollTo({top:0,behavior:'smooth'})})};walkBtn.onclick=async()=>{const d=await api('checkInWalkIn',{fullName:wiName.value.trim(),phone:wiPhone.value.trim(),groupName:wiGroup.value,tier:wiTier.value,paymentStatus:wiStatus.value,paymentMethod:wiMethod.value,amountPaid:Number(wiAmount.value)||0});msg('walkMsg',d.ok?`Checked in ${d.name} — ${d.serial}. Give wristband.`:d.error,d.ok?'success':'error')};photoBtn.onclick=()=>qrImageInput.click();
/* QR scanner implementation intentionally preserved from the working v5 scanner. */
let scannerStream=null,scannerRafId=null,barcodeDetector=null,scannerBusy=false,qrDecoderLoadPromise=null;const scannerOverlay=document.getElementById('scannerOverlay'),scannerVideo=document.getElementById('scannerVideo'),scannerCanvas=document.getElementById('scannerCanvas'),scannerStatus=document.getElementById('scannerStatus'),scannerCloseBtn=document.getElementById('scannerCloseBtn');async function initBarcodeDetector(){if(!('BarcodeDetector'in window))return null;try{const formats=await BarcodeDetector.getSupportedFormats();if(!formats.includes('qr_code'))return null;return new BarcodeDetector({formats:['qr_code']})}catch(e){return null}}
function loadScriptWithTimeout(src,timeoutMs=7000){return new Promise((resolve,reject)=>{const existing=Array.from(document.scripts).find(s=>s.src===src);if(existing&&typeof jsQR!=='undefined'){resolve(true);return}const script=existing||document.createElement('script');let settled=false;const finish=ok=>{if(settled)return;settled=true;clearTimeout(timer);ok?resolve(true):reject(new Error('Failed to load '+src))};script.onload=()=>finish(typeof jsQR!=='undefined');script.onerror=()=>finish(false);if(!existing){script.src=src;script.async=true;document.head.appendChild(script)}const timer=setTimeout(()=>finish(typeof jsQR!=='undefined'),timeoutMs)})}
async function ensureQrDecoder(){if(typeof jsQR!=='undefined')return true;if(qrDecoderLoadPromise)return qrDecoderLoadPromise;qrDecoderLoadPromise=(async()=>{const sources=[new URL('jsQR.js',window.location.href).href,'https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js','https://unpkg.com/jsqr@1.4.0/dist/jsQR.js','https://cdn.jsdelivr.net/gh/cozmo/jsQR@master/dist/jsQR.js'];for(const src of sources){if(typeof jsQR!=='undefined')return true;try{await loadScriptWithTimeout(src)}catch(e){}}return typeof jsQR!=='undefined'})();const ok=await qrDecoderLoadPromise;if(!ok)qrDecoderLoadPromise=null;return ok}
async function handleScannedCode(value){const code=(value||'').trim();if(!code||scannerBusy)return;scannerBusy=true;checkInSerial.value=code;scannerStatus.textContent='✅ QR code read. Checking ticket…';setTimeout(()=>{stopScanner();scannerBusy=false;doCheckIn()},450)}
async function startScanner(){scannerBusy=false;scannerStatus.textContent='Point the rear camera at the QR code and hold steady.';scannerOverlay.style.display='flex';if(!window.isSecureContext){scannerStatus.textContent='Camera scanning requires HTTPS.';return}if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){scannerStatus.textContent='Camera access is not available. Use Scan from Photo or type the ticket number.';return}barcodeDetector=await initBarcodeDetector();if(!barcodeDetector&&typeof jsQR==='undefined'){scannerStatus.textContent='Loading QR reader…';if(!await ensureQrDecoder()){scannerStatus.textContent='QR reader could not load. Check your connection.';return}scannerStatus.textContent='Point the rear camera at the QR code and hold steady.'}try{const constraints={audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}}};try{scannerStream=await navigator.mediaDevices.getUserMedia(constraints)}catch(e){scannerStream=await navigator.mediaDevices.getUserMedia({video:true,audio:false})}scannerVideo.srcObject=scannerStream;await new Promise(resolve=>{if(scannerVideo.readyState>=1)return resolve();scannerVideo.onloadedmetadata=resolve});await scannerVideo.play();scannerRafId=requestAnimationFrame(scanFrame)}catch(err){scannerStatus.textContent='Camera could not start. Allow camera permission, or use Scan from Photo.'}}
function stopScanner(){if(scannerRafId)cancelAnimationFrame(scannerRafId);scannerRafId=null;if(scannerStream){scannerStream.getTracks().forEach(t=>t.stop());scannerStream=null}scannerVideo.srcObject=null;scannerOverlay.style.display='none'}
async function detectQrFromCanvas(c){if(barcodeDetector){try{const codes=await barcodeDetector.detect(c);if(codes?.length&&codes[0].rawValue)return codes[0].rawValue}catch(e){}}if(typeof jsQR!=='undefined'){const ctx=c.getContext('2d'),im=ctx.getImageData(0,0,c.width,c.height),code=jsQR(im.data,im.width,im.height,{inversionAttempts:'attemptBoth'});if(code?.data)return code.data}return''}
async function scanFrame(){if(!scannerStream||scannerBusy)return;if(scannerVideo.readyState===scannerVideo.HAVE_ENOUGH_DATA&&scannerVideo.videoWidth>0){const ctx=scannerCanvas.getContext('2d',{willReadFrequently:true}),maxWidth=960,scale=Math.min(1,maxWidth/scannerVideo.videoWidth);scannerCanvas.width=Math.round(scannerVideo.videoWidth*scale);scannerCanvas.height=Math.round(scannerVideo.videoHeight*scale);ctx.drawImage(scannerVideo,0,0,scannerCanvas.width,scannerCanvas.height);const value=await detectQrFromCanvas(scannerCanvas);if(value){await handleScannedCode(value);return}}scannerRafId=requestAnimationFrame(scanFrame)}
async function scanQrImageFile(file){if(!file)return;barcodeDetector=await initBarcodeDetector();scannerOverlay.style.display='flex';scannerStatus.textContent='Reading QR code from photo…';if(!barcodeDetector&&typeof jsQR==='undefined'&&!await ensureQrDecoder()){scannerStatus.textContent='QR reader could not load.';qrImageInput.value='';return}try{const img=new Image(),u=URL.createObjectURL(file);await new Promise((res,rej)=>{img.onload=res;img.onerror=rej;img.src=u});const maxWidth=1600,scale=Math.min(1,maxWidth/img.naturalWidth);scannerCanvas.width=Math.max(1,Math.round(img.naturalWidth*scale));scannerCanvas.height=Math.max(1,Math.round(img.naturalHeight*scale));const ctx=scannerCanvas.getContext('2d',{willReadFrequently:true});ctx.drawImage(img,0,0,scannerCanvas.width,scannerCanvas.height);URL.revokeObjectURL(u);const value=await detectQrFromCanvas(scannerCanvas);if(!value){scannerStatus.textContent='No QR code found in that photo.';return}await handleScannedCode(value)}catch(e){scannerStatus.textContent='Could not read that image.'}finally{qrImageInput.value=''}}
scanQrBtn.addEventListener('click',startScanner);scannerCloseBtn.addEventListener('click',stopScanner);qrImageInput.addEventListener('change',()=>scanQrImageFile(qrImageInput.files&&qrImageInput.files[0]));
</script></body></html>
