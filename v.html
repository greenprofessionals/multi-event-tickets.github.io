<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ticket Voucher</title><link rel="stylesheet" href="styles.css"><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script><script src="site-config.js"></script><script src="shared.js"></script></head><body><header><div class="eyebrow" id="eyebrow">Digital Event Ticketing System</div><h1 id="title">Ticket Voucher</h1><p id="tagline">Claim or distribute your voucher.</p></header><main>
<div class="card hidden" id="batchCard"><h2>Vouchers to Distribute</h2><p>Each voucher can be sent once or claimed by you. Claimed vouchers remain viewable.</p><div id="batchList"></div><div id="batchErr"></div></div>
<div class="card hidden" id="claimCard"><h2>Claim This Ticket</h2><div id="invite" class="notice hidden"></div><form id="claimForm"><label>Full name</label><input id="name" required><div class="row"><div><label>Email <span style="font-weight:400">(optional)</span></label><input id="email" type="email"></div><div><label>Phone <span style="font-weight:400">(optional)</span></label><input id="phone" type="tel"></div></div><div id="groupWrap"><label id="groupLabel">Chapter</label><select id="group"></select></div><label>Ticket type</label><div id="tiers"></div><button style="margin-top:18px" type="submit">Claim My Ticket</button><div id="claimErr"></div></form></div>
<div class="card ticket-result hidden" id="result"><h2>Your ticket is ready</h2><div id="serial" style="font-size:20px;font-weight:800;color:var(--green);margin-bottom:12px"></div><canvas id="ticket"></canvas><div class="toolbar" style="justify-content:center;margin-top:14px"><a class="btn gold" id="download">Download Ticket</a><button class="secondary" id="share" type="button">Share Ticket</button></div></div>
</main><footer>Voucher links contain no admin controls.</footer><script>
let eventData=null,tiers={},eventId='',voucherToken=MultiTickets.qs('voucher');const batchId=MultiTickets.qs('batch');
const nameEl=document.getElementById('name'),emailEl=document.getElementById('email'),phoneEl=document.getElementById('phone'),groupEl=document.getElementById('group'),ticketEl=document.getElementById('ticket'),serialEl=document.getElementById('serial'),downloadEl=document.getElementById('download'),claimCardEl=document.getElementById('claimCard'),resultEl=document.getElementById('result'),inviteEl=document.getElementById('invite'),groupWrapEl=document.getElementById('groupWrap'),groupLabelEl=document.getElementById('groupLabel');function setBrand(e){eventData=e;eventId=e.EventID;MultiTickets.applyBrand(e);eyebrow.textContent=`${e.OrgName} · ${e.ChapterName}`;title.textContent=e.EventTitle;tagline.textContent=e.Tagline||'Digital ticket voucher'}function showErr(id,m){const x=document.getElementById(id);x.className='error';x.textContent=m}
async function loadVoucher(){claimCard.classList.remove('hidden');const d=await MultiTickets.get({action:'voucher',token:voucherToken});if(!d.ok){if(d.alreadyClaimed&&d.serial&&d.checkInToken){setBrand(d.event);tiers=(await MultiTickets.loadEvent(d.eventId)).tiers;await showTicket(d.serial,d.tier,d.checkInToken);claimCard.classList.add('hidden');return}throw new Error(d.error||'Voucher is invalid.')}setBrand(d.event);tiers=d.tiers||{};nameEl.value=d.name||'';phoneEl.value=d.phone||'';if(d.name||d.phone||d.groupName) {inviteEl.classList.remove('hidden');inviteEl.textContent='Some details were suggested by the distributor. You can change them before claiming.'}const use=String(eventData.UseGroups).toLowerCase()!=='false';groupWrapEl.classList.toggle('hidden',!use);groupLabelEl.textContent=eventData.GroupLabel||'Chapter';const cleanGroups=(d.groups||[]).map(g=>String(g??'').trim()).filter(g=>g && g.toLowerCase()!=='undefined' && g.toLowerCase()!=='null');const suggested=String(d.groupName??'').trim();groupEl.innerHTML=cleanGroups.map(g=>`<option value="${MultiTickets.esc(g)}" ${g===suggested?'selected':''}>${MultiTickets.esc(g)}</option>`).join('');tiersEl(d.tier)}
function tiersEl(lockTier){document.getElementById('tiers').innerHTML=Object.entries(tiers).map(([k,t],i)=>`<label style="border:1px solid #d6cfbd;border-radius:10px;padding:12px;margin:8px 0;display:flex;gap:10px"><input style="width:auto" type="radio" name="tier" value="${k}" ${(lockTier===k||(!lockTier&&i===0))?'checked':''} ${lockTier&&lockTier!==k?'disabled':''}><span>${MultiTickets.esc(t.label)}</span><strong style="margin-left:auto">${MultiTickets.money(t.price,eventData.CurrencySymbol||'$')}</strong></label>`).join('')}
async function loadBatch(){batchCard.classList.remove('hidden');const d=await MultiTickets.get({action:'batch',batch:batchId});if(!d.ok)throw new Error(d.error||'Batch not found.');setBrand(d.event);tiers=d.tiers||{};batchList.innerHTML='';d.vouchers.forEach((v,i)=>{const row=document.createElement('div');row.className='event-card';const label=tiers[v.tier]?.label||'Recipient chooses tier';row.innerHTML=`<h3>Voucher #${i+1}</h3><div>${MultiTickets.esc(label)}</div><div class="pill">${v.claimed?'Claimed':v.dispatched?'Sent':'Available'}</div><div class="toolbar" style="margin-top:10px"></div>`;const tb=row.querySelector('.toolbar');if(v.claimed){const a=document.createElement('a');a.className='btn secondary';a.href=`v.html?voucher=${encodeURIComponent(v.token)}`;a.textContent='View Ticket';tb.appendChild(a)}else if(!v.dispatched){const mine=document.createElement('a');mine.className='btn secondary';mine.href=`v.html?voucher=${encodeURIComponent(v.token)}`;mine.textContent='Claim for Myself';tb.appendChild(mine);const send=document.createElement('button');send.textContent='Send to Someone';send.onclick=()=>openSend(row,v);tb.appendChild(send)}batchList.appendChild(row)})}
function openSend(row,v){let p=row.querySelector('.send-panel');if(p){p.remove();return}p=document.createElement('div');p.className='send-panel';p.innerHTML='<div class="row"><div><label>Email</label><input class="em" type="email"></div><div><label>Phone</label><input class="ph" type="tel"></div></div><div class="toolbar"><button class="emailBtn">Send Email</button><button class="secondary textBtn">Text</button><button class="secondary waBtn">WhatsApp</button></div><div class="msg"></div>';row.appendChild(p);const record=async()=>{const d=await MultiTickets.post({action:'sendVoucher',token:v.token,recipientEmail:p.querySelector('.em').value.trim(),recipientPhone:p.querySelector('.ph').value.trim()});if(!d.ok)throw new Error(d.error||'Could not send.');return d};p.querySelector('.emailBtn').onclick=async()=>{try{await record();location.reload()}catch(e){p.querySelector('.msg').className='error';p.querySelector('.msg').textContent=e.message}};p.querySelector('.textBtn').onclick=async()=>{try{const d=await record(),ph=p.querySelector('.ph').value.replace(/\D/g,'');location.href=`sms:${ph}?body=${encodeURIComponent('Claim your ticket: '+d.url)}`}catch(e){p.querySelector('.msg').className='error';p.querySelector('.msg').textContent=e.message}};p.querySelector('.waBtn').onclick=async()=>{try{const d=await record(),ph=p.querySelector('.ph').value.replace(/\D/g,'');window.open(`https://wa.me/${ph}?text=${encodeURIComponent('Claim your ticket: '+d.url)}`,'_blank')}catch(e){p.querySelector('.msg').className='error';p.querySelector('.msg').textContent=e.message}}}
async function showTicket(s,tok,qrToken){await MultiTickets.renderTicket(ticketEl,eventData,tiers,tok,s,qrToken);serialEl.textContent=s;downloadEl.href=ticketEl.toDataURL('image/png');downloadEl.download=`ticket-${s}.png`;resultEl.classList.remove('hidden')}
claimForm.addEventListener('submit',async ev=>{ev.preventDefault();try{const tier=document.querySelector('input[name=tier]:checked')?.value||'';const d=await MultiTickets.post({action:'claim',eventId,fullName:nameEl.value.trim(),email:emailEl.value.trim(),phone:phoneEl.value.trim(),groupName:groupEl.value||'',tier,voucher:voucherToken});if(!d.ok)throw new Error(d.error||'Could not claim.');await showTicket(d.serial,d.tier,d.checkInToken);claimCardEl.classList.add('hidden')}catch(e){showErr('claimErr',e.message)}});share.onclick=async()=>{try{const blob=await new Promise(r=>ticketEl.toBlob(r,'image/png'));const f=new File([blob],downloadEl.download,{type:'image/png'});if(navigator.canShare?.({files:[f]}))await navigator.share({files:[f],title:'My Ticket'});else alert('Download the ticket and share the saved image.')}catch(_){}};
(async()=>{try{if(batchId)await loadBatch();else if(voucherToken)await loadVoucher();else throw new Error('This voucher link is incomplete.')}catch(e){showErr(batchId?'batchErr':'claimErr',e.message)}})();
</script></body></html>
